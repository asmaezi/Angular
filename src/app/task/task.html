<p>{{ title }}</p>
<button (click)="rename()">Rename</button>
<button [disabled]="!canDelete" (click)="delete()">Delete</button>
<br><br>
<button (click)="addTask()">Add Task</button>
<button (click)="deleteAllTask()">Delete All Tasks</button>
<p>{{ count() }} tâche(s)</p>
@if (list.length > 0) {
  <ul>
    @for (item of list; track item.id) {
      <li [style.color]="item.title | color">
        {{ item.id }} | {{ item.title | uppercase }} | {{ item.date | date }}
      </li>
    }
  </ul>
} @else {
  <p class="empty">empty task for now</p>
}
